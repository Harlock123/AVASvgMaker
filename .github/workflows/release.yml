name: build

# The .NET SDK cross-publishes self-contained apps from any host, so all six
# targets are built on one runner. Each comes out as a single executable with
# the runtime and Avalonia's native libraries inside it.
#
# Ahead-of-time compilation is the exception: it cannot cross operating systems,
# and it leaves libSkiaSharp and libHarfBuzzSharp beside the executable rather
# than inside it - so it is an opt-in extra, built per OS, not what ships.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      native:
        description: 'Also build ahead-of-time native binaries'
        type: boolean
        default: false

jobs:
  # Nothing is released that the suite has not agreed to. Headless, so the drag and export
  # tests are the real controls doing the real thing, on a runner with no display.
  test:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run the suite
        run: dotnet test AVASvgMaker.Tests --configuration Release --logger 'console;verbosity=normal'

  single-file:
    name: single file
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build every target
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" == "$GITHUB_REF_NAME" ]] && version="0.0.0-dev"
          ./build.sh --version "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: AVASvgMaker
          path: dist/AVASvgMaker-*

  native:
    name: native ${{ matrix.rid }}
    needs: test
    if: inputs.native
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-11-arm }
          - { rid: osx-x64,     os: macos-13 }
          - { rid: osx-arm64,   os: macos-14 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # The native compiler shells out to clang and needs zlib's headers.
      - name: Install the native toolchain
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build
        shell: bash
        run: ./build.sh --mode aot --targets "${{ matrix.rid }}" --version "0.0.0-native"

      - uses: actions/upload-artifact@v7
        with:
          name: AVASvgMaker-native-${{ matrix.rid }}
          path: dist/AVASvgMaker-*

  # The guide is rebuilt here rather than taken from the repository, so the version on its
  # title page is always the version being released - not whatever it said the last time
  # someone regenerated it by hand. It needs nothing but the SDK: the builder renders with
  # Skia rather than shelling out to a browser or a TeX distribution.
  guide:
    name: guide
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build the guide
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" == "$GITHUB_REF_NAME" ]] && version="0.0.0-dev"
          mkdir -p dist
          dotnet run --project Tools/GuideBuilder -v q -- \
            USERGUIDE.md "dist/AVASvgMaker-$version-USERGUIDE.pdf" "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: AVASvgMaker-guide
          path: dist/AVASvgMaker-*-USERGUIDE.pdf

  release:
    needs: [single-file, guide]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
